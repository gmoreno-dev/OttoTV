name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      upstream_iso_url:
        description: "Upstream LineageOS TV x86 ISO URL (overrides config.env)"
        required: false

jobs:
  # The newest ShellCheck: older ones (24.04 has 0.9) flag things that aren't
  # wrong.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint shell scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -x -P SCRIPTDIR/.. build.sh tools/*.sh tests/run.sh
          shellcheck -s sh iso/scripts/9-otto iso/otto/init-hooks.sh iso/otto/installer/otto-restart tools/device/*.sh

  test:
    # Not 26.04 yet: its C library is built for newer CPUs, so the MOVBE
    # tests can't run a program as an Ivy Bridge there.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tools for the tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mksh qemu-user

      - uses: actions/setup-go@v5
        with:
          go-version-file: remote/go.mod
          cache-dependency-path: remote/go.sum

      - name: Unit tests
        run: tests/run.sh

      - name: Go vet and race tests
        working-directory: remote
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -race ./...

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu runners ship the Android SDK in $ANDROID_HOME.
      - name: Build the TV app
        run: tools/build-tv-app.sh /tmp/connect.apk 0.0.0 /tmp/ci.keystore

  # Manual only: downloads ~2.4 GB and produces an ISO of the same size.
  iso:
    if: github.event_name == 'workflow_dispatch'
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xorriso
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xorriso

      - uses: actions/setup-go@v5
        with:
          go-version-file: remote/go.mod
          cache-dependency-path: remote/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build ISO
        env:
          OVERRIDE_URL: ${{ inputs.upstream_iso_url }}
        run: |
          if [ -n "$OVERRIDE_URL" ]; then
            sed -i "s|^UPSTREAM_ISO_URL=.*|UPSTREAM_ISO_URL=\"$OVERRIDE_URL\"|" config.env
          fi
          ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: otto-iso
          path: out/
          retention-days: 3
          compression-level: 0
