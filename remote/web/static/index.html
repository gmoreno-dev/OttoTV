<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#161B22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Otto TV">
<title>Otto TV</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="remote.css">
<script src="remote.js" defer></script>
</head>
<body>

<!-- Pairing: shown until this phone has the TV's token. -->
<main id="pair" class="screen pair" hidden>
  <img class="pair-logo" src="icon.svg" alt="" width="72" height="72">
  <p class="pair-brand">Otto TV</p>
  <h1 data-t="pairTitle">Pair with the TV</h1>
  <p class="pair-hint" data-t="pairHint">On the TV, open Connect phone and type the 6-digit code shown there.</p>
  <form id="pair-form" autocomplete="off">
    <label class="boxes" id="boxes">
      <span class="visually-hidden" data-t="pinLabel">6-digit code</span>
      <span class="box" aria-hidden="true"></span><span class="box" aria-hidden="true"></span><span class="box" aria-hidden="true"></span>
      <span class="box gap" aria-hidden="true"></span><span class="box" aria-hidden="true"></span><span class="box" aria-hidden="true"></span>
      <input id="pin" name="pin" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6"
             autocomplete="one-time-code" required>
    </label>
    <div class="pair-error-slot">
      <p id="pair-error" class="pair-error" role="alert" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path id="pair-error-icon" d=""/></svg>
        <span id="pair-error-text"></span>
      </p>
    </div>
    <button id="pair-btn" class="pair-btn" type="submit" data-t="pairButton" aria-disabled="true">Pair</button>
  </form>
</main>

<!-- The remote itself. -->
<main id="remote" class="screen remote" hidden>
  <header class="top">
    <div class="tv">
      <img src="icon.svg" alt="" width="30" height="30">
      <span id="tv-name">Otto TV</span>
      <span id="status-dot" class="dot" aria-hidden="true"></span>
      <span id="status-text" class="visually-hidden"></span>
    </div>
    <div class="top-actions">
      <!-- Shown when the TV runs on a laptop: turns its own screen dark. -->
      <button id="laptop-btn" class="chip" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path id="laptop-icon" d="M4 5h16v11H4z M2 19.5h20"/></svg>
        <span id="laptop-text" data-t="screenOn">Screen on</span>
      </button>
      <button class="round-btn" data-key="power" data-t-label="power" aria-label="Sleep">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </header>

  <div id="reconnecting" class="banner warn" role="status" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8 M4 4v4h4 M4 13a8 8 0 0 0 14.3 4.9L20 16 M20 20v-4h-4"/></svg>
    <span data-t="reconnecting">Reconnecting…</span>
  </div>
  <div id="down" class="banner down" role="alert" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path class="faint" d="M2.5 9a14 14 0 0 1 19 0 M5.5 12.5a9.5 9.5 0 0 1 13 0 M8.8 16a5 5 0 0 1 6.4 0"/><path d="M12 19.5h.01 M4 3.5l16 17"/></svg>
    <span data-t="noInput">The TV can’t receive commands right now</span>
  </div>

  <div id="body" class="body">
    <!-- Mode: remote -->
    <section id="mode-buttons" class="mode control">
      <div class="dpad" role="group" data-t-label="dpad" aria-label="Directional pad">
        <button class="arrow up" data-key="up" data-hold data-t-label="up" aria-label="Up"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
        <button class="arrow right" data-key="right" data-hold data-t-label="right" aria-label="Right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
        <button class="arrow down" data-key="down" data-hold data-t-label="down" aria-label="Down"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
        <button class="arrow left" data-key="left" data-hold data-t-label="left" aria-label="Left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="ok" data-key="ok" data-hold>OK</button>
      </div>

      <div class="nav">
        <button class="key" data-key="back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14l-5-5 5-5 M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span data-t="back">Back</span></button>
        <button class="key" data-key="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5.5v-6h-5v6H4z"/></svg><span data-t="home">Home</span></button>
        <button class="key" data-key="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16 M4 12h16 M4 17h16"/></svg><span data-t="menu">Menu</span></button>
      </div>

      <div class="media">
        <div class="volume" role="group" data-t-label="volume" aria-label="Volume">
          <button data-key="voldown" data-hold data-t-label="voldown" aria-label="Volume down"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.5v5h3.5L12 19V5L6.5 9.5H3z M16 12h5"/></svg></button>
          <button data-key="mute" data-t-label="mute" aria-label="Mute"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.5v5h3.5L12 19V5L6.5 9.5H3z M16 9.5l5 5 M21 9.5l-5 5"/></svg></button>
          <button data-key="volup" data-hold data-t-label="volup" aria-label="Volume up"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.5v5h3.5L12 19V5L6.5 9.5H3z M16 12h5 M18.5 9.5v5"/></svg></button>
        </div>
        <button class="key play" data-key="play" data-t-label="play" aria-label="Play or pause"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5v13l8-6.5z M15.5 5.5v13 M20 5.5v13"/></svg></button>
      </div>
    </section>

    <!-- Mode: touchpad -->
    <section id="mode-touchpad" class="mode touch" hidden>
      <div id="pad" class="pad" role="application" aria-label="Touchpad">
        <div class="pad-hint">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10 M12 9.5a1.5 1.5 0 0 1 3 0V11 M15 10.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1a5 5 0 0 1-4.2-2.3L4.5 15a1.5 1.5 0 0 1 2.4-1.8L9 15"/></svg>
          <p data-t="padHint">Drag to move. Tap to click. Two fingers to scroll, tap with two to go back.</p>
        </div>
        <span id="touch" class="touch-dot" aria-hidden="true"></span>
      </div>
    </section>

    <!-- Mode: keyboard -->
    <section id="mode-keyboard" class="mode type" hidden>
      <label class="field">
        <span class="visually-hidden" data-t="typeLabel">Text for the TV</span>
        <textarea id="typing" autocomplete="off" autocorrect="off" autocapitalize="off"
                  spellcheck="false" enterkeyhint="send" rows="3"></textarea>
        <span id="typing-hint" class="field-hint" aria-hidden="true" data-t="typeHint">What you type shows up on the TV.</span>
      </label>
      <div class="keys">
        <button class="key" data-key="backspace"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h11v14H9l-6-7z M12 9.5l5 5 M17 9.5l-5 5"/></svg><span data-t="erase">Erase</span></button>
        <button class="key" data-key="space"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h16v-4"/></svg><span data-t="space">Space</span></button>
        <button class="key accent" data-key="enter"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 5v6a3 3 0 0 1-3 3H5 M9 10l-4 4 4 4"/></svg><span data-t="enter">Enter</span></button>
      </div>
      <p id="type-note" class="notice" role="status" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-18 0a9 9 0 1 1 18 0z M12 11v5.5 M12 7.5h.01"/></svg>
        <span data-t="skipped">Some characters can’t be typed on the TV and were skipped.</span>
      </p>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"><span id="toast-text"></span></div>

  <nav class="tabs" role="tablist" data-t-label="modes" aria-label="Remote modes">
    <button role="tab" data-mode="buttons" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 1 0 18a9 9 0 1 1 0-18z M12 7l-2.2 2.4h4.4z M12 17l-2.2-2.4h4.4z M7 12l2.4-2.2v4.4z M17 12l-2.4-2.2v4.4z"/></svg><span data-t="tabButtons">Remote</span></button>
    <button role="tab" data-mode="touchpad" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z M12 13.5a1.5 1.5 0 1 0 0-3a1.5 1.5 0 1 0 0 3z"/></svg><span data-t="tabTouchpad">Touchpad</span></button>
    <button role="tab" data-mode="keyboard" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2z M6 10h.01 M10 10h.01 M14 10h.01 M18 10h.01 M8 14h8"/></svg><span data-t="tabKeyboard">Keyboard</span></button>
  </nav>
</main>

</body>
</html>
